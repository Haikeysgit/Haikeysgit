<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="230" viewBox="0 0 1000 230" role="img" aria-label="Imisioluwa Obaseki (Haikeys), Full-Stack Engineer: web apps, blockchain, AI agents">
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name { fill: #f0f6fc; font-size: 46px; font-weight: 700; }
    .role { fill: #c9d1d9; font-size: 24px; }
    .handle { fill: #6e7681; font-size: 16px; }
    .pill { font-size: 15px; font-weight: 600; }
    .fade { opacity: 0; animation: in 0.6s ease-out forwards; }
    .d1 { animation-delay: 0.1s; } .d2 { animation-delay: 0.4s; }
    .d3 { animation-delay: 0.8s; } .d4 { animation-delay: 1.1s; } .d5 { animation-delay: 1.4s; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <clipPath id="card"><rect width="1000" height="230" rx="14"/></clipPath>
  </defs>

  <rect width="1000" height="230" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="999" height="229" rx="14" fill="none" stroke="#30363d"/>
  <rect x="0" y="0" width="1000" height="5" fill="url(#bar)" clip-path="url(#card)"/>

  <text x="48" y="58" class="mono handle fade d1">@haikeysgit<tspan class="cursor" fill="#58a6ff"> _</tspan></text>
  <text x="48" y="112" class="name fade d2">Imisioluwa Obaseki</text>
  <text x="48" y="150" class="role fade d3">Full-Stack Engineer</text>

  <g class="fade d4">
    <rect x="48" y="174" width="110" height="32" rx="16" fill="#58a6ff" fill-opacity="0.15" stroke="#58a6ff" stroke-opacity="0.5"/>
    <text x="103" y="195" text-anchor="middle" class="pill" fill="#79c0ff">Web apps</text>
    <rect x="170" y="174" width="120" height="32" rx="16" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="230" y="195" text-anchor="middle" class="pill" fill="#56d364">Blockchain</text>
    <rect x="302" y="174" width="110" height="32" rx="16" fill="#a371f7" fill-opacity="0.15" stroke="#a371f7" stroke-opacity="0.5"/>
    <text x="357" y="195" text-anchor="middle" class="pill" fill="#bc8cff">AI agents</text>
  </g>

  <g class="fade d5" fill="none" stroke-width="2" stroke-linecap="round">
    <path d="M760 70 h120 v40 h60" stroke="#58a6ff" stroke-opacity="0.6"/>
    <path d="M760 115 h80 v-45 h100" stroke="#3fb950" stroke-opacity="0.5"/>
    <path d="M760 160 h150 v-50 h30" stroke="#a371f7" stroke-opacity="0.6"/>
    <circle cx="760" cy="70" r="5" fill="#58a6ff"/>
    <circle cx="760" cy="115" r="5" fill="#3fb950"/>
    <circle cx="760" cy="160" r="5" fill="#a371f7"/>
    <circle cx="940" cy="110" r="9" fill="#0d1117" stroke="#c9d1d9"/>
  </g>
</svg>
