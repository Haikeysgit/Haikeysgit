<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Imisioluwa Obaseki (Haikeys): smart contracts, onchain apps, and agents that check their own work">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .prompt { fill: #7ee787; font-size: 18px; }
    .cmd { fill: #c9d1d9; font-size: 18px; }
    .name { fill: #f0f6fc; font-size: 34px; font-weight: 700; }
    .handle { fill: #8b949e; font-size: 34px; font-weight: 400; }
    .out { fill: #79c0ff; font-size: 18px; }
    .cursor { fill: #7ee787; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <defs>
    <clipPath id="c1"><rect x="40" y="70" height="30" width="0">
      <animate attributeName="width" from="0" to="140" begin="0.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="104" height="50" width="0">
      <animate attributeName="width" from="0" to="820" begin="1.1s" dur="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="168" height="30" width="0">
      <animate attributeName="width" from="0" to="220" begin="2.8s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="198" height="30" width="0">
      <animate attributeName="width" from="0" to="760" begin="3.6s" dur="2s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="260" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="30" cy="28" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="28" r="6" fill="#febc2e"/>
  <circle cx="70" cy="28" r="6" fill="#28c840"/>
  <text x="450" y="33" text-anchor="middle" class="mono" fill="#6e7681" font-size="13">haikeys@github: ~</text>

  <g class="mono">
    <text x="40" y="92" clip-path="url(#c1)"><tspan class="prompt">$ </tspan><tspan class="cmd">whoami</tspan></text>
    <text x="40" y="140" clip-path="url(#c2)"><tspan class="name">Imisioluwa Obaseki</tspan><tspan class="handle"> / Haikeys</tspan></text>
    <text x="40" y="190" clip-path="url(#c3)"><tspan class="prompt">$ </tspan><tspan class="cmd">cat focus.txt</tspan></text>
    <text x="40" y="220" class="out" clip-path="url(#c4)">smart contracts · onchain apps · agents that check their work<tspan class="cursor"> ▌</tspan></text>
  </g>
</svg>
